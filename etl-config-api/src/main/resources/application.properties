# Spring Boot application name
spring.application.name=etl-config-api

# Server port (optional, default is 8080)
# server.port=8081

# Oracle Datasource Configuration (Update with actual values)
spring.datasource.url=jdbc:oracle:thin:@//your_oracle_host:1521/your_service_name
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate # Recommended: none for prod, validate/update for dev
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect # Or Oracle10gDialect, OracleDialect for newer versions
spring.jpa.show-sql=true # For debugging SQL queries
spring.jpa.properties.hibernate.format_sql=true # For pretty SQL logging

# Logging (optional, Spring Boot has good defaults)
# logging.level.org.springframework=INFO
# logging.level.com.example.etl.api=DEBUG
